<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1632 1056" width="17in" height="11in"><style>text{font-family:Helvetica,Arial,sans-serif}</style>
<rect width="1632" height="1056" fill="#FFFFFF"/>
<rect x="0" y="0" width="1632" height="64" fill="#72264C"/>
<text x="32" y="28" font-size="20" font-weight="750" fill="#FFFFFF">FDE platform engineering · enterprise agent · panel 4 of 6</text>
<text x="32" y="50" font-size="14" font-weight="500" fill="#F3D6E4">Steps 9-10 · evals and operations · SAY · ASK · PLATFORM BOX · FAIL IF SKIPPED · DETERMINISTIC BIAS</text>
<text x="32" y="88" font-size="13" fill="#5F5E5A">from panel 3</text>
<text x="1600" y="88" font-size="13" fill="#5F5E5A" text-anchor="end">to panel 5</text>
<rect x="28.0" y="108.0" width="780.0" height="900.0" rx="10" fill="#FFFFFF" stroke="#9B3D6A" stroke-width="2.4"/>
<rect x="28.0" y="108.0" width="780.0" height="58" rx="10" fill="#72264C"/>
<rect x="28.0" y="128.0" width="780.0" height="38" fill="#72264C"/>
<circle cx="56.0" cy="137.0" r="16" fill="#FFFFFF"/>
<text x="56.0" y="143.0" text-anchor="middle" font-size="16" font-weight="750" fill="#72264C">9</text>
<text x="78.0" y="132.0" font-size="16" font-weight="750" fill="#FFFFFF">Define evaluation and hallucination controls</text>
<rect x="29.2" y="166.0" width="777.6" height="127.9" fill="#FFFFFF"/>
<text x="42.0" y="182.0" font-size="11" font-weight="750" fill="#9B3D6A" letter-spacing="0.08em">SAY</text>
<text x="42.0" y="200.0" font-size="16" font-weight="500" fill="#1A1918">Evals ship with the agent: drift fixtures plus correct-usage checks (allowed tools and args). Fail closed.</text>
<text x="42.0" y="221.0" font-size="16" font-weight="500" fill="#1A1918">Hallucination control is cite or ground, or abstain. It is not a nicer prompt.</text>
<rect x="29.2" y="293.9" width="777.6" height="220.7" fill="#FBEAF2"/>
<text x="42.0" y="309.9" font-size="11" font-weight="750" fill="#72264C" letter-spacing="0.08em">ASK</text>
<text x="42.0" y="327.9" font-size="16" font-weight="500" fill="#1A1918">1. What fixture set proves the agent still uses only allowed tools and arguments?</text>
<text x="42.0" y="348.9" font-size="16" font-weight="500" fill="#1A1918">2. What is the abstain behavior when retrieval is empty, untagged, or cross-tenant?</text>
<text x="42.0" y="369.9" font-size="16" font-weight="500" fill="#1A1918">3. Who owns the eval gate in CI, and what exact failure blocks a release?</text>
<rect x="29.2" y="514.6" width="777.6" height="172.8" fill="#F4F8FC"/>
<text x="42.0" y="530.6" font-size="11" font-weight="750" fill="#0C447C" letter-spacing="0.08em">PLATFORM BOX</text>
<text x="42.0" y="548.6" font-size="16" font-weight="500" fill="#1A1918">Eval suite (drift plus correct-usage), fail-closed gate before side effects, grounding/citation rule, board for</text>
<text x="42.0" y="569.6" font-size="16" font-weight="500" fill="#1A1918">eval failures.</text>
<rect x="29.2" y="687.4" width="777.6" height="142.8" fill="#FCEBEB"/>
<text x="42.0" y="703.4" font-size="11" font-weight="750" fill="#791F1F" letter-spacing="0.08em">FAIL IF SKIPPED</text>
<text x="42.0" y="721.4" font-size="16" font-weight="500" fill="#1A1918">You find hallucinations in production. Side effects already happened. Trust is gone.</text>
<rect x="29.2" y="830.2" width="777.6" height="133.8" fill="#FAFAF7"/>
<text x="42.0" y="846.2" font-size="11" font-weight="750" fill="#2C2C2A" letter-spacing="0.08em">DETERMINISTIC BIAS</text>
<text x="42.0" y="864.2" font-size="16" font-weight="500" fill="#1A1918">Schema validation, allowlist tests, and fail-closed gates are rules. Do not ask the model if it is sure.</text>
<rect x="28.0" y="964.0" width="780.0" height="44" fill="#72264C"/>
<rect x="28.0" y="964.0" width="780.0" height="12" fill="#72264C"/>
<text x="42.0" y="982.0" font-size="12" font-weight="750" fill="#FFFFFF">THEME: Evals travel with the agent. Fail closed. Cite or abstain.</text>
<line x1="810.0" y1="558.0" x2="822.0" y2="558.0" stroke="#2C2C2A" stroke-width="2.5"/>
<rect x="824.0" y="108.0" width="780.0" height="900.0" rx="10" fill="#FFFFFF" stroke="#534AB7" stroke-width="2.4"/>
<rect x="824.0" y="108.0" width="780.0" height="58" rx="10" fill="#3C3489"/>
<rect x="824.0" y="128.0" width="780.0" height="38" fill="#3C3489"/>
<circle cx="852.0" cy="137.0" r="16" fill="#FFFFFF"/>
<text x="852.0" y="143.0" text-anchor="middle" font-size="16" font-weight="750" fill="#3C3489">10</text>
<text x="874.0" y="132.0" font-size="16" font-weight="750" fill="#FFFFFF">Define monitoring, latency, cost, reliability, and operations</text>
<rect x="825.2" y="166.0" width="777.6" height="127.9" fill="#FFFFFF"/>
<text x="838.0" y="182.0" font-size="11" font-weight="750" fill="#534AB7" letter-spacing="0.08em">SAY</text>
<text x="838.0" y="200.0" font-size="16" font-weight="500" fill="#1A1918">SLOs cover availability, freshness, and error budget. SLAs if contracted. Business outcomes (tickets</text>
<text x="838.0" y="221.0" font-size="16" font-weight="500" fill="#1A1918">closed, hours saved, conversion) sit next to p95. Latency alone is not ops.</text>
<rect x="825.2" y="293.9" width="777.6" height="220.7" fill="#EFEDF8"/>
<text x="838.0" y="309.9" font-size="11" font-weight="750" fill="#3C3489" letter-spacing="0.08em">ASK</text>
<text x="838.0" y="327.9" font-size="16" font-weight="500" fill="#1A1918">1. What is the error budget, and what freezes the agent when it burns?</text>
<text x="838.0" y="348.9" font-size="16" font-weight="500" fill="#1A1918">2. Which business metric proves the job moved, not just that calls succeeded?</text>
<text x="838.0" y="369.9" font-size="16" font-weight="500" fill="#1A1918">3. What is the cost per completed job versus the SLA floor, and who sees that board?</text>
<rect x="825.2" y="514.6" width="777.6" height="172.8" fill="#F4F8FC"/>
<text x="838.0" y="530.6" font-size="11" font-weight="750" fill="#0C447C" letter-spacing="0.08em">PLATFORM BOX</text>
<text x="838.0" y="548.6" font-size="16" font-weight="500" fill="#1A1918">SLO/SLA card, outcome dashboard (tickets, hours, conversion), cost and latency boards, freshness SLO,</text>
<text x="838.0" y="569.6" font-size="16" font-weight="500" fill="#1A1918">freeze runbook.</text>
<rect x="825.2" y="687.4" width="777.6" height="142.8" fill="#FCEBEB"/>
<text x="838.0" y="703.4" font-size="11" font-weight="750" fill="#791F1F" letter-spacing="0.08em">FAIL IF SKIPPED</text>
<text x="838.0" y="721.4" font-size="16" font-weight="500" fill="#1A1918">A fast, cheap, wrong agent. Or a correct agent nobody can operate when retrieval goes stale.</text>
<rect x="825.2" y="830.2" width="777.6" height="133.8" fill="#FAFAF7"/>
<text x="838.0" y="846.2" font-size="11" font-weight="750" fill="#2C2C2A" letter-spacing="0.08em">DETERMINISTIC BIAS</text>
<text x="838.0" y="864.2" font-size="16" font-weight="500" fill="#1A1918">Freeze, budget burn, and page routing are rules. The model does not decide whether it is healthy.</text>
<rect x="824.0" y="964.0" width="780.0" height="44" fill="#3C3489"/>
<rect x="824.0" y="964.0" width="780.0" height="12" fill="#3C3489"/>
<text x="838.0" y="982.0" font-size="12" font-weight="750" fill="#FFFFFF">THEME: SLO plus SLA plus business outcomes. Not latency alone.</text>
<text x="816" y="1038" text-anchor="middle" font-size="13" fill="#5F5E5A">agents.html · Ship agent story stays separate · dense reference, not a slogan poster</text>
</svg>
