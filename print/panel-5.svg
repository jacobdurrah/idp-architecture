<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1632 1056" width="17in" height="11in">
<rect width="1632" height="1056" fill="#FFFFFF"/>
<rect x="0" y="0" width="1632" height="64" fill="#72264C"/>
<text x="32" y="28" font-size="20" font-weight="750" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif">FDE platform engineering · enterprise agent · panel 5 of 6</text>
<text x="32" y="50" font-size="14" font-weight="500" fill="#F3D6E4" font-family="Helvetica,Arial,sans-serif">Steps 11-12 · troubleshoot and tradeoffs · SAY · ASK · PLATFORM BOX · FAIL IF SKIPPED · DETERMINISTIC BIAS</text>
<text x="32" y="88" font-size="13" fill="#5F5E5A" font-family="Helvetica,Arial,sans-serif">from panel 4</text>
<text x="1600" y="88" font-size="13" fill="#5F5E5A" text-anchor="end" font-family="Helvetica,Arial,sans-serif">to panel 6</text>
<rect x="28.0" y="108.0" width="780.0" height="900.0" rx="10" fill="#FFFFFF" stroke="#A32D2D" stroke-width="2.4"/>
<rect x="28.0" y="108.0" width="780.0" height="58" rx="10" fill="#791F1F"/>
<rect x="28.0" y="128.0" width="780.0" height="38" fill="#791F1F"/>
<circle cx="56.0" cy="137.0" r="16" fill="#FFFFFF"/>
<text x="56.0" y="143.0" text-anchor="middle" font-size="16" font-weight="750" fill="#791F1F" font-family="Helvetica,Arial,sans-serif">11</text>
<text x="78.0" y="132.0" font-size="16" font-weight="750" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif">Troubleshoot failures systematically</text>
<rect x="29.2" y="166.0" width="777.6" height="125.4" fill="#FFFFFF"/>
<text x="42.0" y="182.0" font-size="11" font-weight="750" fill="#A32D2D" font-family="Helvetica,Arial,sans-serif" letter-spacing="0.08em">SAY</text>
<text x="42.0" y="200.0" font-size="16" font-weight="500" fill="#1A1918" font-family="Helvetica,Arial,sans-serif">Trace which tenant, which tool, which retrieval set, and which policy denied. Read boards, not chat</text>
<text x="42.0" y="221.0" font-size="16" font-weight="500" fill="#1A1918" font-family="Helvetica,Arial,sans-serif">archaeology. If observe is dark, freeze autonomous loops.</text>
<rect x="29.2" y="291.4" width="777.6" height="214.8" fill="#FCEBEB"/>
<text x="42.0" y="307.4" font-size="11" font-weight="750" fill="#791F1F" font-family="Helvetica,Arial,sans-serif" letter-spacing="0.08em">ASK</text>
<text x="42.0" y="325.4" font-size="16" font-weight="500" fill="#1A1918" font-family="Helvetica,Arial,sans-serif">1. Which tenant and which token scope was active on the failing hop?</text>
<text x="42.0" y="346.4" font-size="16" font-weight="500" fill="#1A1918" font-family="Helvetica,Arial,sans-serif">2. Which retrieval tags fired, and which policy denied the tool or the document?</text>
<text x="42.0" y="367.4" font-size="16" font-weight="500" fill="#1A1918" font-family="Helvetica,Arial,sans-serif">3. What board should already show this, and why is it empty?</text>
<rect x="29.2" y="506.2" width="777.6" height="168.2" fill="#F4F8FC"/>
<text x="42.0" y="522.2" font-size="11" font-weight="750" fill="#0C447C" font-family="Helvetica,Arial,sans-serif" letter-spacing="0.08em">PLATFORM BOX</text>
<text x="42.0" y="540.2" font-size="16" font-weight="500" fill="#1A1918" font-family="Helvetica,Arial,sans-serif">Incident board: tenant, tool, retrieval set, policy decision, trace ids. Freeze switch. Runbook that starts at</text>
<text x="42.0" y="561.2" font-size="16" font-weight="500" fill="#1A1918" font-family="Helvetica,Arial,sans-serif">the board, not at Slack.</text>
<rect x="29.2" y="674.4" width="777.6" height="138.6" fill="#FCEBEB"/>
<text x="42.0" y="690.4" font-size="11" font-weight="750" fill="#791F1F" font-family="Helvetica,Arial,sans-serif" letter-spacing="0.08em">FAIL IF SKIPPED</text>
<text x="42.0" y="708.4" font-size="16" font-weight="500" fill="#1A1918" font-family="Helvetica,Arial,sans-serif">People grep chat. The next incident is slower. You cannot tell a policy deny from a model miss.</text>
<rect x="29.2" y="813.0" width="777.6" height="151.0" fill="#FAFAF7"/>
<text x="42.0" y="829.0" font-size="11" font-weight="750" fill="#2C2C2A" font-family="Helvetica,Arial,sans-serif" letter-spacing="0.08em">DETERMINISTIC BIAS</text>
<text x="42.0" y="847.0" font-size="16" font-weight="500" fill="#1A1918" font-family="Helvetica,Arial,sans-serif">Triage order and freeze conditions are a runbook. Do not let the agent try something else while observe is</text>
<text x="42.0" y="868.0" font-size="16" font-weight="500" fill="#1A1918" font-family="Helvetica,Arial,sans-serif">dark.</text>
<rect x="28.0" y="964.0" width="780.0" height="44" fill="#791F1F"/>
<rect x="28.0" y="964.0" width="780.0" height="12" fill="#791F1F"/>
<text x="42.0" y="982.0" font-size="12" font-weight="750" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif">THEME: Boards over chat archaeology. Tenant, tool, retrieval, policy on one trace.</text>
<line x1="810.0" y1="558.0" x2="822.0" y2="558.0" stroke="#2C2C2A" stroke-width="2.5"/>
<rect x="824.0" y="108.0" width="780.0" height="900.0" rx="10" fill="#FFFFFF" stroke="#0C447C" stroke-width="2.4"/>
<rect x="824.0" y="108.0" width="780.0" height="58" rx="10" fill="#06325C"/>
<rect x="824.0" y="128.0" width="780.0" height="38" fill="#06325C"/>
<circle cx="852.0" cy="137.0" r="16" fill="#FFFFFF"/>
<text x="852.0" y="143.0" text-anchor="middle" font-size="16" font-weight="750" fill="#06325C" font-family="Helvetica,Arial,sans-serif">12</text>
<text x="874.0" y="132.0" font-size="16" font-weight="750" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif">Compare alternatives and tradeoffs</text>
<rect x="825.2" y="166.0" width="777.6" height="125.4" fill="#FFFFFF"/>
<text x="838.0" y="182.0" font-size="11" font-weight="750" fill="#0C447C" font-family="Helvetica,Arial,sans-serif" letter-spacing="0.08em">SAY</text>
<text x="838.0" y="200.0" font-size="16" font-weight="500" fill="#1A1918" font-family="Helvetica,Arial,sans-serif">Name the real forks: more model versus more workflow; shared index versus per-tenant; sync versus</text>
<text x="838.0" y="221.0" font-size="16" font-weight="500" fill="#1A1918" font-family="Helvetica,Arial,sans-serif">async tools. Cost, isolation, and time-to-value have to be on the same slide.</text>
<rect x="825.2" y="291.4" width="777.6" height="214.8" fill="#E4F0FA"/>
<text x="838.0" y="307.4" font-size="11" font-weight="750" fill="#06325C" font-family="Helvetica,Arial,sans-serif" letter-spacing="0.08em">ASK</text>
<text x="838.0" y="325.4" font-size="16" font-weight="500" fill="#1A1918" font-family="Helvetica,Arial,sans-serif">1. What isolation do you lose with a shared index, and is that acceptable for this data class?</text>
<text x="838.0" y="346.4" font-size="16" font-weight="500" fill="#1A1918" font-family="Helvetica,Arial,sans-serif">2. Which tools must be async because of SLA or human-in-the-loop, and which must be sync?</text>
<text x="838.0" y="367.4" font-size="16" font-weight="500" fill="#1A1918" font-family="Helvetica,Arial,sans-serif">3. What is the 90-day cost and risk of the model-heavy path versus the workflow-heavy path?</text>
<rect x="825.2" y="506.2" width="777.6" height="168.2" fill="#F4F8FC"/>
<text x="838.0" y="522.2" font-size="11" font-weight="750" fill="#0C447C" font-family="Helvetica,Arial,sans-serif" letter-spacing="0.08em">PLATFORM BOX</text>
<text x="838.0" y="540.2" font-size="16" font-weight="500" fill="#1A1918" font-family="Helvetica,Arial,sans-serif">Tradeoff matrix: model vs workflow, index shape (shared vs per-tenant), sync vs async tools, cost,</text>
<text x="838.0" y="561.2" font-size="16" font-weight="500" fill="#1A1918" font-family="Helvetica,Arial,sans-serif">isolation, time-to-value.</text>
<rect x="825.2" y="674.4" width="777.6" height="138.6" fill="#FCEBEB"/>
<text x="838.0" y="690.4" font-size="11" font-weight="750" fill="#791F1F" font-family="Helvetica,Arial,sans-serif" letter-spacing="0.08em">FAIL IF SKIPPED</text>
<text x="838.0" y="708.4" font-size="16" font-weight="500" fill="#1A1918" font-family="Helvetica,Arial,sans-serif">The customer hears a stack, not a choice. They cannot defend isolation or cost to their CISO or CFO.</text>
<rect x="825.2" y="813.0" width="777.6" height="151.0" fill="#FAFAF7"/>
<text x="838.0" y="829.0" font-size="11" font-weight="750" fill="#2C2C2A" font-family="Helvetica,Arial,sans-serif" letter-spacing="0.08em">DETERMINISTIC BIAS</text>
<text x="838.0" y="847.0" font-size="16" font-weight="500" fill="#1A1918" font-family="Helvetica,Arial,sans-serif">When isolation, audit, or SLA is the binding constraint, pick workflow and per-tenant index over a larger</text>
<text x="838.0" y="868.0" font-size="16" font-weight="500" fill="#1A1918" font-family="Helvetica,Arial,sans-serif">model.</text>
<rect x="824.0" y="964.0" width="780.0" height="44" fill="#06325C"/>
<rect x="824.0" y="964.0" width="780.0" height="12" fill="#06325C"/>
<text x="838.0" y="982.0" font-size="12" font-weight="750" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif">THEME: More model vs more workflow. Shared vs per-tenant index. Sync vs async tools.</text>
<text x="816" y="1038" text-anchor="middle" font-size="13" fill="#5F5E5A" font-family="Helvetica,Arial,sans-serif">agents.html · Ship agent story stays separate · dense reference, not a slogan poster</text>
</svg>
