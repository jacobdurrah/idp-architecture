<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="11in" height="8.5in">
<rect width="1100" height="850" fill="#FFFFFF"/>
<rect x="0" y="0" width="1100" height="72" fill="#72264C"/>
<text x="40" y="34" font-size="22" font-weight="750" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif">FDE enterprise agent path · panel 2 of 4</text>
<text x="40" y="58" font-size="16" font-weight="500" fill="#F3D6E4" font-family="Helvetica,Arial,sans-serif">Tagged data + deterministic workflow</text>
<text x="40" y="100" font-size="14" fill="#5F5E5A" font-family="Helvetica,Arial,sans-serif">← from panel 1</text>
<text x="1060" y="100" font-size="14" fill="#5F5E5A" text-anchor="end" font-family="Helvetica,Arial,sans-serif">to panel 3 →</text>
<rect x="40.0" y="130" width="496.0" height="560" rx="16" fill="#E8F5F0" stroke="#0F6E56" stroke-width="2.4"/>
<circle cx="76.0" cy="170" r="22" fill="#0F6E56"/>
<text x="76.0" y="177" text-anchor="middle" font-size="20" font-weight="750" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif">4</text>
<text x="110.0" y="178" font-size="22" font-weight="750" fill="#0F6E56" font-family="Helvetica,Arial,sans-serif">Tagged data ingress</text>
<text x="68.0" y="230" font-size="18" font-weight="500" fill="#2C2C2A" font-family="Helvetica,Arial,sans-serif">Every record tagged: source, tenant, classification,</text>
<text x="68.0" y="258" font-size="18" font-weight="500" fill="#2C2C2A" font-family="Helvetica,Arial,sans-serif">consent, lineage. Warehouse and indexes inherit tags.</text>
<text x="68.0" y="286" font-size="18" font-weight="500" fill="#2C2C2A" font-family="Helvetica,Arial,sans-serif">Untagged = not queryable.</text>
<line x1="540.0" y1="410.0" x2="560.0" y2="410.0" stroke="#2C2C2A" stroke-width="3"/>
<polygon points="560.0,410.0 548.0,402.0 548.0,418.0" fill="#2C2C2A"/>
<rect x="564.0" y="130" width="496.0" height="560" rx="16" fill="#EAF2FA" stroke="#185FA5" stroke-width="2.4"/>
<circle cx="600.0" cy="170" r="22" fill="#185FA5"/>
<text x="600.0" y="177" text-anchor="middle" font-size="20" font-weight="750" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif">5</text>
<text x="634.0" y="178" font-size="22" font-weight="750" fill="#185FA5" font-family="Helvetica,Arial,sans-serif">Deterministic workflow</text>
<text x="592.0" y="230" font-size="18" font-weight="500" fill="#2C2C2A" font-family="Helvetica,Arial,sans-serif">Orchestrator / state machine / rules first. Prefer</text>
<text x="592.0" y="258" font-size="18" font-weight="500" fill="#2C2C2A" font-family="Helvetica,Arial,sans-serif">deterministic solutions for mechanical work. Model</text>
<text x="592.0" y="286" font-size="18" font-weight="500" fill="#2C2C2A" font-family="Helvetica,Arial,sans-serif">only where judgment is required.</text>
<text x="550" y="820" text-anchor="middle" font-size="14" fill="#5F5E5A" font-family="Helvetica,Arial,sans-serif">jacobdurrah.github.io/idp-architecture/agents.html</text>
</svg>
