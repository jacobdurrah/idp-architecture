<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="11in" height="8.5in">
<rect width="1100" height="850" fill="#FFFFFF"/>
<rect x="0" y="0" width="1100" height="72" fill="#72264C"/>
<text x="40" y="34" font-size="22" font-weight="750" fill="#FFFFFF">FDE enterprise agent path · panel 2 of 4</text>
<text x="40" y="58" font-size="16" font-weight="500" fill="#F3D6E4">Architecture → trust + tools + privacy · 14-step interview spine</text>
<text x="40" y="100" font-size="14" fill="#5F5E5A">← from panel 1</text>
<text x="1060" y="100" font-size="14" fill="#5F5E5A" text-anchor="end">to panel 3 →</text>
<rect x="36" y="120" width="239" height="580" rx="14" fill="#EAF2FA" stroke="#185FA5" stroke-width="2.2"/>
<circle cx="70" cy="156" r="20" fill="#185FA5"/>
<text x="70" y="162" text-anchor="middle" font-size="18" font-weight="750" fill="#FFFFFF">5</text>
<text x="56" y="198" font-size="17" font-weight="750" fill="#185FA5">Propose the initial</text>
<text x="56" y="222" font-size="17" font-weight="750" fill="#185FA5">architecture.</text>
<text x="56" y="256" font-size="15" font-weight="500" fill="#2C2C2A">Sketch planes: identity,</text>
<text x="56" y="278" font-size="15" font-weight="500" fill="#2C2C2A">policy, workflow,</text>
<text x="56" y="300" font-size="15" font-weight="500" fill="#2C2C2A">retrieval, model, tools,</text>
<text x="56" y="322" font-size="15" font-weight="500" fill="#2C2C2A">boards, observe. Prefer</text>
<text x="56" y="344" font-size="15" font-weight="500" fill="#2C2C2A">category names over</text>
<text x="56" y="366" font-size="15" font-weight="500" fill="#2C2C2A">vendor dumps.</text>
<line x1="277" y1="410" x2="297" y2="410" stroke="#2C2C2A" stroke-width="3"/>
<polygon points="297,410 286,403 286,417" fill="#2C2C2A"/>
<rect x="299" y="120" width="239" height="580" rx="14" fill="#EAF2FA" stroke="#185FA5" stroke-width="2.2"/>
<circle cx="333" cy="156" r="20" fill="#185FA5"/>
<text x="333" y="162" text-anchor="middle" font-size="18" font-weight="750" fill="#FFFFFF">6</text>
<text x="319" y="198" font-size="17" font-weight="750" fill="#185FA5">Explain data flow,</text>
<text x="319" y="222" font-size="17" font-weight="750" fill="#185FA5">control flow, and</text>
<text x="319" y="246" font-size="17" font-weight="750" fill="#185FA5">trust boundaries.</text>
<text x="319" y="280" font-size="15" font-weight="500" fill="#2C2C2A">Where data moves, who</text>
<text x="319" y="302" font-size="15" font-weight="500" fill="#2C2C2A">decides, where trust</text>
<text x="319" y="324" font-size="15" font-weight="500" fill="#2C2C2A">stops. RBAC (role-based</text>
<text x="319" y="346" font-size="15" font-weight="500" fill="#2C2C2A">access control), tenant</text>
<text x="319" y="368" font-size="15" font-weight="500" fill="#2C2C2A">isolation, scoped</text>
<text x="319" y="390" font-size="15" font-weight="500" fill="#2C2C2A">credential handoff.</text>
<line x1="540" y1="410" x2="560" y2="410" stroke="#2C2C2A" stroke-width="3"/>
<polygon points="560,410 549,403 549,417" fill="#2C2C2A"/>
<rect x="562" y="120" width="239" height="580" rx="14" fill="#FBEAF2" stroke="#9B3D6A" stroke-width="2.2"/>
<circle cx="596" cy="156" r="20" fill="#9B3D6A"/>
<text x="596" y="162" text-anchor="middle" font-size="18" font-weight="750" fill="#FFFFFF">7</text>
<text x="582" y="198" font-size="17" font-weight="750" fill="#9B3D6A">Discuss retrieval,</text>
<text x="582" y="222" font-size="17" font-weight="750" fill="#9B3D6A">grounding, model</text>
<text x="582" y="246" font-size="17" font-weight="750" fill="#9B3D6A">interaction, and</text>
<text x="582" y="270" font-size="17" font-weight="750" fill="#9B3D6A">tools.</text>
<text x="582" y="304" font-size="15" font-weight="500" fill="#2C2C2A">Tagged retrieval.</text>
<text x="582" y="326" font-size="15" font-weight="500" fill="#2C2C2A">Deterministic workflow</text>
<text x="582" y="348" font-size="15" font-weight="500" fill="#2C2C2A">and tool allowlists for</text>
<text x="582" y="370" font-size="15" font-weight="500" fill="#2C2C2A">mechanical work. Model</text>
<text x="582" y="392" font-size="15" font-weight="500" fill="#2C2C2A">only for judgment. MCP</text>
<text x="582" y="414" font-size="15" font-weight="500" fill="#2C2C2A">tools behind policy.</text>
<line x1="803" y1="410" x2="823" y2="410" stroke="#2C2C2A" stroke-width="3"/>
<polygon points="823,410 812,403 812,417" fill="#2C2C2A"/>
<rect x="825" y="120" width="239" height="580" rx="14" fill="#EAF2FA" stroke="#185FA5" stroke-width="2.2"/>
<circle cx="859" cy="156" r="20" fill="#185FA5"/>
<text x="859" y="162" text-anchor="middle" font-size="18" font-weight="750" fill="#FFFFFF">8</text>
<text x="845" y="198" font-size="17" font-weight="750" fill="#185FA5">Address privacy,</text>
<text x="845" y="222" font-size="17" font-weight="750" fill="#185FA5">identity, tenant</text>
<text x="845" y="246" font-size="17" font-weight="750" fill="#185FA5">isolation, and</text>
<text x="845" y="270" font-size="17" font-weight="750" fill="#185FA5">auditability.</text>
<text x="845" y="304" font-size="15" font-weight="500" fill="#2C2C2A">Tenant = customer</text>
<text x="845" y="326" font-size="15" font-weight="500" fill="#2C2C2A">boundary. Human and agent</text>
<text x="845" y="348" font-size="15" font-weight="500" fill="#2C2C2A">identity. Short-lived</text>
<text x="845" y="370" font-size="15" font-weight="500" fill="#2C2C2A">scoped tokens. Auditable</text>
<text x="845" y="392" font-size="15" font-weight="500" fill="#2C2C2A">sensitive actions.</text>
<text x="550" y="820" text-anchor="middle" font-size="14" fill="#5F5E5A">jacobdurrah.github.io/idp-architecture/agents.html</text>
</svg>
