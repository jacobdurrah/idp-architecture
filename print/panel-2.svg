<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1632 1056" width="17in" height="11in"><style>text{font-family:Helvetica,Arial,sans-serif}</style>
<rect width="1632" height="1056" fill="#FFFFFF"/>
<rect x="0" y="0" width="1632" height="64" fill="#72264C"/>
<text x="32" y="28" font-size="20" font-weight="750" fill="#FFFFFF">FDE platform engineering · enterprise agent · panel 2 of 6</text>
<text x="32" y="50" font-size="14" font-weight="500" fill="#F3D6E4">Steps 4-6 · requirements to trust boundaries · SAY · ASK · PLATFORM BOX · FAIL IF SKIPPED · DETERMINISTIC BIAS</text>
<text x="32" y="88" font-size="13" fill="#5F5E5A">from panel 1</text>
<text x="1600" y="88" font-size="13" fill="#5F5E5A" text-anchor="end">to panel 3</text>
<rect x="28.0" y="108.0" width="514.7" height="900.0" rx="10" fill="#FFFFFF" stroke="#185FA5" stroke-width="2.4"/>
<rect x="28.0" y="108.0" width="514.7" height="58" rx="10" fill="#0C447C"/>
<rect x="28.0" y="128.0" width="514.7" height="38" fill="#0C447C"/>
<circle cx="56.0" cy="137.0" r="16" fill="#FFFFFF"/>
<text x="56.0" y="143.0" text-anchor="middle" font-size="16" font-weight="750" fill="#0C447C">4</text>
<text x="78.0" y="132.0" font-size="16" font-weight="750" fill="#FFFFFF">Define functional and non-functional requirements</text>
<rect x="29.2" y="166.0" width="512.3" height="135.0" fill="#FFFFFF"/>
<text x="42.0" y="182.0" font-size="11" font-weight="750" fill="#185FA5" letter-spacing="0.08em">SAY</text>
<text x="42.0" y="200.0" font-size="15" font-weight="500" fill="#1A1918">Functional is the job the agent or workflow must complete.</text>
<text x="42.0" y="220.0" font-size="15" font-weight="500" fill="#1A1918">Non-functional is the contract: tenant isolation, audit, p95 latency, cost</text>
<text x="42.0" y="240.0" font-size="15" font-weight="500" fill="#1A1918">per query, human-in-the-loop SLA.</text>
<rect x="29.2" y="301.0" width="512.3" height="232.2" fill="#EAF2FA"/>
<text x="42.0" y="317.0" font-size="11" font-weight="750" fill="#0C447C" letter-spacing="0.08em">ASK</text>
<text x="42.0" y="335.0" font-size="15" font-weight="500" fill="#1A1918">1. What must be true for every tenant, not just the pilot, including isolation</text>
<text x="42.0" y="355.0" font-size="15" font-weight="500" fill="#1A1918">and audit?</text>
<text x="42.0" y="375.0" font-size="15" font-weight="500" fill="#1A1918">2. What is the p95 and the cost ceiling per completed job, not per token?</text>
<text x="42.0" y="395.0" font-size="15" font-weight="500" fill="#1A1918">3. When must a human be in the loop, and what is that SLA from page to</text>
<text x="42.0" y="415.0" font-size="15" font-weight="500" fill="#1A1918">decision?</text>
<rect x="29.2" y="533.2" width="512.3" height="150.8" fill="#F4F8FC"/>
<text x="42.0" y="549.2" font-size="11" font-weight="750" fill="#0C447C" letter-spacing="0.08em">PLATFORM BOX</text>
<text x="42.0" y="567.2" font-size="15" font-weight="500" fill="#1A1918">Requirements sheet: jobs, NFRs (isolation, audit, p95, cost/query, HITL</text>
<text x="42.0" y="587.2" font-size="15" font-weight="500" fill="#1A1918">SLA), data classes, token scope, retention.</text>
<rect x="29.2" y="684.0" width="512.3" height="143.6" fill="#FCEBEB"/>
<text x="42.0" y="700.0" font-size="11" font-weight="750" fill="#791F1F" letter-spacing="0.08em">FAIL IF SKIPPED</text>
<text x="42.0" y="718.0" font-size="15" font-weight="500" fill="#1A1918">You ship a clever path with no isolation, no audit, and no latency or cost</text>
<text x="42.0" y="738.0" font-size="15" font-weight="500" fill="#1A1918">bound. Finance and security both veto.</text>
<rect x="29.2" y="827.6" width="512.3" height="136.4" fill="#FAFAF7"/>
<text x="42.0" y="843.6" font-size="11" font-weight="750" fill="#2C2C2A" letter-spacing="0.08em">DETERMINISTIC BIAS</text>
<text x="42.0" y="861.6" font-size="15" font-weight="500" fill="#1A1918">Encode NFRs as policy and workflow gates, not as prompt instructions.</text>
<text x="42.0" y="881.6" font-size="15" font-weight="500" fill="#1A1918">Isolation, audit, and HITL are rules.</text>
<rect x="28.0" y="964.0" width="514.7" height="44" fill="#0C447C"/>
<rect x="28.0" y="964.0" width="514.7" height="12" fill="#0C447C"/>
<text x="42.0" y="982.0" font-size="12" font-weight="750" fill="#FFFFFF">THEME: NFRs are tenant isolation, audit, p95, cost/query, and human-in-loop SLA.</text>
<line x1="544.7" y1="558.0" x2="556.7" y2="558.0" stroke="#2C2C2A" stroke-width="2.5"/>
<rect x="558.7" y="108.0" width="514.7" height="900.0" rx="10" fill="#FFFFFF" stroke="#185FA5" stroke-width="2.4"/>
<rect x="558.7" y="108.0" width="514.7" height="58" rx="10" fill="#0C447C"/>
<rect x="558.7" y="128.0" width="514.7" height="38" fill="#0C447C"/>
<circle cx="586.7" cy="137.0" r="16" fill="#FFFFFF"/>
<text x="586.7" y="143.0" text-anchor="middle" font-size="16" font-weight="750" fill="#0C447C">5</text>
<text x="608.7" y="132.0" font-size="16" font-weight="750" fill="#FFFFFF">Propose the initial architecture</text>
<rect x="559.9" y="166.0" width="512.3" height="135.0" fill="#FFFFFF"/>
<text x="572.7" y="182.0" font-size="11" font-weight="750" fill="#185FA5" letter-spacing="0.08em">SAY</text>
<text x="572.7" y="200.0" font-size="15" font-weight="500" fill="#1A1918">Draw ingress to tagged store to deterministic workflow to gated agent to</text>
<text x="572.7" y="220.0" font-size="15" font-weight="500" fill="#1A1918">boards to observe. Use category names: IdP, policy engine, workflow</text>
<text x="572.7" y="240.0" font-size="15" font-weight="500" fill="#1A1918">engine, secrets broker, tool gateway, warehouse.</text>
<rect x="559.9" y="301.0" width="512.3" height="232.2" fill="#EAF2FA"/>
<text x="572.7" y="317.0" font-size="11" font-weight="750" fill="#0C447C" letter-spacing="0.08em">ASK</text>
<text x="572.7" y="335.0" font-size="15" font-weight="500" fill="#1A1918">1. Where does tagging happen, before the model ever sees a token or a</text>
<text x="572.7" y="355.0" font-size="15" font-weight="500" fill="#1A1918">document?</text>
<text x="572.7" y="375.0" font-size="15" font-weight="500" fill="#1A1918">2. Which plane owns credentials (secrets broker, not the agent) and which</text>
<text x="572.7" y="395.0" font-size="15" font-weight="500" fill="#1A1918">plane owns RBAC?</text>
<text x="572.7" y="415.0" font-size="15" font-weight="500" fill="#1A1918">3. What is out of the agent and inside workflow on day one?</text>
<rect x="559.9" y="533.2" width="512.3" height="150.8" fill="#F4F8FC"/>
<text x="572.7" y="549.2" font-size="11" font-weight="750" fill="#0C447C" letter-spacing="0.08em">PLATFORM BOX</text>
<text x="572.7" y="567.2" font-size="15" font-weight="500" fill="#1A1918">One-page architecture: planes, trust boundaries, tagged store, workflow</text>
<text x="572.7" y="587.2" font-size="15" font-weight="500" fill="#1A1918">vs agent split, boards, observe. Category names, not a vendor dump.</text>
<rect x="559.9" y="684.0" width="512.3" height="143.6" fill="#FCEBEB"/>
<text x="572.7" y="700.0" font-size="11" font-weight="750" fill="#791F1F" letter-spacing="0.08em">FAIL IF SKIPPED</text>
<text x="572.7" y="718.0" font-size="15" font-weight="500" fill="#1A1918">A vendor collage. Nobody can say where RBAC, tokens, or tenant tags</text>
<text x="572.7" y="738.0" font-size="15" font-weight="500" fill="#1A1918">live, so the build becomes a pile of connectors.</text>
<rect x="559.9" y="827.6" width="512.3" height="136.4" fill="#FAFAF7"/>
<text x="572.7" y="843.6" font-size="11" font-weight="750" fill="#2C2C2A" letter-spacing="0.08em">DETERMINISTIC BIAS</text>
<text x="572.7" y="861.6" font-size="15" font-weight="500" fill="#1A1918">Default the spine to workflow. The agent is a gated judgment box, not the</text>
<text x="572.7" y="881.6" font-size="15" font-weight="500" fill="#1A1918">orchestrator.</text>
<rect x="558.7" y="964.0" width="514.7" height="44" fill="#0C447C"/>
<rect x="558.7" y="964.0" width="514.7" height="12" fill="#0C447C"/>
<text x="572.7" y="982.0" font-size="12" font-weight="750" fill="#FFFFFF">THEME: Ingress, tagged store, deterministic workflow, gated agent, boards, observe.</text>
<line x1="1075.3" y1="558.0" x2="1087.3" y2="558.0" stroke="#2C2C2A" stroke-width="2.5"/>
<rect x="1089.3" y="108.0" width="514.7" height="900.0" rx="10" fill="#FFFFFF" stroke="#185FA5" stroke-width="2.4"/>
<rect x="1089.3" y="108.0" width="514.7" height="58" rx="10" fill="#0C447C"/>
<rect x="1089.3" y="128.0" width="514.7" height="38" fill="#0C447C"/>
<circle cx="1117.3" cy="137.0" r="16" fill="#FFFFFF"/>
<text x="1117.3" y="143.0" text-anchor="middle" font-size="16" font-weight="750" fill="#0C447C">6</text>
<text x="1139.3" y="132.0" font-size="16" font-weight="750" fill="#FFFFFF">Explain data flow, control flow, and trust boundaries</text>
<rect x="1090.5" y="166.0" width="512.3" height="147.8" fill="#FFFFFF"/>
<text x="1103.3" y="182.0" font-size="11" font-weight="750" fill="#185FA5" letter-spacing="0.08em">SAY</text>
<text x="1103.3" y="200.0" font-size="15" font-weight="500" fill="#1A1918">Data flow is what moves and how it is tagged. Control flow is who</text>
<text x="1103.3" y="220.0" font-size="15" font-weight="500" fill="#1A1918">decides. Trust boundaries sit at the IdP, the secrets broker, and the tool</text>
<text x="1103.3" y="240.0" font-size="15" font-weight="500" fill="#1A1918">gateway. A user-delegated scoped token rides the workflow; the agent</text>
<text x="1103.3" y="260.0" font-size="15" font-weight="500" fill="#1A1918">never holds a long-lived user password.</text>
<rect x="1090.5" y="313.8" width="512.3" height="235.4" fill="#EAF2FA"/>
<text x="1103.3" y="329.8" font-size="11" font-weight="750" fill="#0C447C" letter-spacing="0.08em">ASK</text>
<text x="1103.3" y="347.8" font-size="15" font-weight="500" fill="#1A1918">1. Where does a retrieval stop if the tenant tag does not match, at index or</text>
<text x="1103.3" y="367.8" font-size="15" font-weight="500" fill="#1A1918">only after the model?</text>
<text x="1103.3" y="387.8" font-size="15" font-weight="500" fill="#1A1918">2. Which hop mints the short-lived token, what is its scope and TTL, and</text>
<text x="1103.3" y="407.8" font-size="15" font-weight="500" fill="#1A1918">what never sees the user password?</text>
<text x="1103.3" y="427.8" font-size="15" font-weight="500" fill="#1A1918">3. What can the model see that the tool gateway will still refuse, and who</text>
<text x="1103.3" y="447.8" font-size="15" font-weight="500" fill="#1A1918">owns that deny?</text>
<rect x="1090.5" y="549.2" width="512.3" height="157.6" fill="#F4F8FC"/>
<text x="1103.3" y="565.2" font-size="11" font-weight="750" fill="#0C447C" letter-spacing="0.08em">PLATFORM BOX</text>
<text x="1103.3" y="583.2" font-size="15" font-weight="500" fill="#1A1918">Flow diagram with two inks: data vs control. Boxes at IdP, secrets</text>
<text x="1103.3" y="603.2" font-size="15" font-weight="500" fill="#1A1918">broker, tool gateway. Token scope table (actor, scope, TTL, broker).</text>
<text x="1103.3" y="623.2" font-size="15" font-weight="500" fill="#1A1918">RBAC on tools and on data.</text>
<rect x="1090.5" y="706.8" width="512.3" height="131.6" fill="#FCEBEB"/>
<text x="1103.3" y="722.8" font-size="11" font-weight="750" fill="#791F1F" letter-spacing="0.08em">FAIL IF SKIPPED</text>
<text x="1103.3" y="740.8" font-size="15" font-weight="500" fill="#1A1918">The agent becomes a second control plane with standing credentials. One</text>
<text x="1103.3" y="760.8" font-size="15" font-weight="500" fill="#1A1918">prompt can cross a tenant or call a write tool.</text>
<rect x="1090.5" y="838.4" width="512.3" height="125.6" fill="#FAFAF7"/>
<text x="1103.3" y="854.4" font-size="11" font-weight="750" fill="#2C2C2A" letter-spacing="0.08em">DETERMINISTIC BIAS</text>
<text x="1103.3" y="872.4" font-size="15" font-weight="500" fill="#1A1918">Token mint, tenant match, and tool RBAC are workflow and policy. Never</text>
<text x="1103.3" y="892.4" font-size="15" font-weight="500" fill="#1A1918">leave them to model judgment.</text>
<rect x="1089.3" y="964.0" width="514.7" height="44" fill="#0C447C"/>
<rect x="1089.3" y="964.0" width="514.7" height="12" fill="#0C447C"/>
<text x="1103.3" y="982.0" font-size="12" font-weight="750" fill="#FFFFFF">THEME: Scoped short-lived tokens ride the workflow. Agent never holds the user</text>
<text x="1103.3" y="997.0" font-size="12" font-weight="750" fill="#FFFFFF">password.</text>
<text x="816" y="1038" text-anchor="middle" font-size="13" fill="#5F5E5A">agents.html · Ship agent story stays separate · dense reference, not a slogan poster</text>
</svg>
