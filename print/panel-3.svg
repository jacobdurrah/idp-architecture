<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1632 1056" width="17in" height="11in"><style>text{font-family:Helvetica,Arial,sans-serif}</style>
<rect width="1632" height="1056" fill="#FFFFFF"/>
<rect x="0" y="0" width="1632" height="64" fill="#72264C"/>
<text x="32" y="28" font-size="20" font-weight="750" fill="#FFFFFF">FDE platform engineering · enterprise agent · panel 3 of 6</text>
<text x="32" y="50" font-size="14" font-weight="500" fill="#F3D6E4">Steps 7-8 · retrieval, tools, privacy · SAY · ASK · PLATFORM BOX · FAIL IF SKIPPED · DETERMINISTIC BIAS</text>
<text x="32" y="88" font-size="13" fill="#5F5E5A">from panel 2</text>
<text x="1600" y="88" font-size="13" fill="#5F5E5A" text-anchor="end">to panel 4</text>
<rect x="28.0" y="108.0" width="780.0" height="900.0" rx="10" fill="#FFFFFF" stroke="#9B3D6A" stroke-width="2.4"/>
<rect x="28.0" y="108.0" width="780.0" height="58" rx="10" fill="#72264C"/>
<rect x="28.0" y="128.0" width="780.0" height="38" fill="#72264C"/>
<circle cx="56.0" cy="137.0" r="16" fill="#FFFFFF"/>
<text x="56.0" y="143.0" text-anchor="middle" font-size="16" font-weight="750" fill="#72264C">7</text>
<text x="78.0" y="132.0" font-size="16" font-weight="750" fill="#FFFFFF">Discuss retrieval, grounding, model interaction, and tools</text>
<rect x="29.2" y="166.0" width="777.6" height="125.4" fill="#FFFFFF"/>
<text x="42.0" y="182.0" font-size="11" font-weight="750" fill="#9B3D6A" letter-spacing="0.08em">SAY</text>
<text x="42.0" y="200.0" font-size="16" font-weight="500" fill="#1A1918">Retrieval is tagged (tenant, system, classification, lineage) or it is not retrieval. Tools are allowlisted MCP</text>
<text x="42.0" y="221.0" font-size="16" font-weight="500" fill="#1A1918">verbs behind the gateway. The model judges; mechanical steps stay workflow and rules.</text>
<rect x="29.2" y="291.4" width="777.6" height="214.8" fill="#FBEAF2"/>
<text x="42.0" y="307.4" font-size="11" font-weight="750" fill="#72264C" letter-spacing="0.08em">ASK</text>
<text x="42.0" y="325.4" font-size="16" font-weight="500" fill="#1A1918">1. Which tags are mandatory on every hit, and what happens on a miss or an untagged chunk?</text>
<text x="42.0" y="346.4" font-size="16" font-weight="500" fill="#1A1918">2. What is the allowlist of tools and arguments for this job, including writes vs reads?</text>
<text x="42.0" y="367.4" font-size="16" font-weight="500" fill="#1A1918">3. Which steps are mechanical and must not call the model at all?</text>
<rect x="29.2" y="506.2" width="777.6" height="168.2" fill="#F4F8FC"/>
<text x="42.0" y="522.2" font-size="11" font-weight="750" fill="#0C447C" letter-spacing="0.08em">PLATFORM BOX</text>
<text x="42.0" y="540.2" font-size="16" font-weight="500" fill="#1A1918">Retrieval schema (required tags), tool allowlist (MCP verbs and args), grounding policy (cite or abstain),</text>
<text x="42.0" y="561.2" font-size="16" font-weight="500" fill="#1A1918">workflow vs judgment split.</text>
<rect x="29.2" y="674.4" width="777.6" height="138.6" fill="#FCEBEB"/>
<text x="42.0" y="690.4" font-size="11" font-weight="750" fill="#791F1F" letter-spacing="0.08em">FAIL IF SKIPPED</text>
<text x="42.0" y="708.4" font-size="16" font-weight="500" fill="#1A1918">Ungrounded generation plus open tools. The demo answers fluently and writes to the wrong tenant.</text>
<rect x="29.2" y="813.0" width="777.6" height="151.0" fill="#FAFAF7"/>
<text x="42.0" y="829.0" font-size="11" font-weight="750" fill="#2C2C2A" letter-spacing="0.08em">DETERMINISTIC BIAS</text>
<text x="42.0" y="847.0" font-size="16" font-weight="500" fill="#1A1918">Mechanical work is workflow and rules. Model only on judgment steps. Tools fail closed outside the</text>
<text x="42.0" y="868.0" font-size="16" font-weight="500" fill="#1A1918">allowlist.</text>
<rect x="28.0" y="964.0" width="780.0" height="44" fill="#72264C"/>
<rect x="28.0" y="964.0" width="780.0" height="12" fill="#72264C"/>
<text x="42.0" y="982.0" font-size="12" font-weight="750" fill="#FFFFFF">THEME: Tagged retrieval. Allowlisted tools. Model for judgment, not orchestration.</text>
<line x1="810.0" y1="558.0" x2="822.0" y2="558.0" stroke="#2C2C2A" stroke-width="2.5"/>
<rect x="824.0" y="108.0" width="780.0" height="900.0" rx="10" fill="#FFFFFF" stroke="#185FA5" stroke-width="2.4"/>
<rect x="824.0" y="108.0" width="780.0" height="58" rx="10" fill="#0C447C"/>
<rect x="824.0" y="128.0" width="780.0" height="38" fill="#0C447C"/>
<circle cx="852.0" cy="137.0" r="16" fill="#FFFFFF"/>
<text x="852.0" y="143.0" text-anchor="middle" font-size="16" font-weight="750" fill="#0C447C">8</text>
<text x="874.0" y="132.0" font-size="16" font-weight="750" fill="#FFFFFF">Address privacy, identity, tenant isolation, and auditability</text>
<rect x="825.2" y="166.0" width="777.6" height="127.9" fill="#FFFFFF"/>
<text x="838.0" y="182.0" font-size="11" font-weight="750" fill="#185FA5" letter-spacing="0.08em">SAY</text>
<text x="838.0" y="200.0" font-size="16" font-weight="500" fill="#1A1918">RBAC on tools and on data. Tenant isolation at query and at index. Every tool call and every retrieval hit is</text>
<text x="838.0" y="221.0" font-size="16" font-weight="500" fill="#1A1918">audited with actor, tenant, and token scope. Identity is human plus agent, never a shared bot password.</text>
<rect x="825.2" y="293.9" width="777.6" height="220.7" fill="#EAF2FA"/>
<text x="838.0" y="309.9" font-size="11" font-weight="750" fill="#0C447C" letter-spacing="0.08em">ASK</text>
<text x="838.0" y="327.9" font-size="16" font-weight="500" fill="#1A1918">1. Is isolation enforced at index and query, or only as a sentence in the prompt?</text>
<text x="838.0" y="348.9" font-size="16" font-weight="500" fill="#1A1918">2. Who is the actor on the audit line: user, agent, or both, and which token scope?</text>
<text x="838.0" y="369.9" font-size="16" font-weight="500" fill="#1A1918">3. What PII classes are forbidden in prompts, traces, and eval fixtures?</text>
<rect x="825.2" y="514.6" width="777.6" height="172.8" fill="#F4F8FC"/>
<text x="838.0" y="530.6" font-size="11" font-weight="750" fill="#0C447C" letter-spacing="0.08em">PLATFORM BOX</text>
<text x="838.0" y="548.6" font-size="16" font-weight="500" fill="#1A1918">Isolation policy, RBAC matrix (role x tool x data class), audit schema (actor, tenant, tool, retrieval ids,</text>
<text x="838.0" y="569.6" font-size="16" font-weight="500" fill="#1A1918">token), delegation standard.</text>
<rect x="825.2" y="687.4" width="777.6" height="142.8" fill="#FCEBEB"/>
<text x="838.0" y="703.4" font-size="11" font-weight="750" fill="#791F1F" letter-spacing="0.08em">FAIL IF SKIPPED</text>
<text x="838.0" y="721.4" font-size="16" font-weight="500" fill="#1A1918">Cross-tenant retrieval or an unaudited write. That is an incident, not a product gap.</text>
<rect x="825.2" y="830.2" width="777.6" height="133.8" fill="#FAFAF7"/>
<text x="838.0" y="846.2" font-size="11" font-weight="750" fill="#2C2C2A" letter-spacing="0.08em">DETERMINISTIC BIAS</text>
<text x="838.0" y="864.2" font-size="16" font-weight="500" fill="#1A1918">Isolation, RBAC, and audit are policy. No model override. Deny by default.</text>
<rect x="824.0" y="964.0" width="780.0" height="44" fill="#0C447C"/>
<rect x="824.0" y="964.0" width="780.0" height="12" fill="#0C447C"/>
<text x="838.0" y="982.0" font-size="12" font-weight="750" fill="#FFFFFF">THEME: RBAC on tools and data. Isolation at query and index. Audit every hop.</text>
<text x="816" y="1038" text-anchor="middle" font-size="13" fill="#5F5E5A">agents.html · Ship agent story stays separate · dense reference, not a slogan poster</text>
</svg>
