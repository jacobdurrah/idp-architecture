Per-job namespace / compose stack / preview cluster · torn down after the run</text><rect x="1148.0" y="1036.0" width="856.0" height="80.0" rx="8" ry="8" fill="#FFF1C9" stroke="#B8860B" stroke-width="1.6"/><rect x="1148.0" y="1036.0" width="5" height="80.0" rx="2.5" fill="#8A6708"/><text x="1162.0" y="1053.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1B2430" text-anchor="start">Results reported back to the PR / Git</text><text x="1162.0" y="1070.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5C6B7A" text-anchor="start">Checks API + comments · required statuses block merge · artifacts retained for debug</text><rect x="1148.0" y="1132.0" width="856.0" height="310.0" rx="8" ry="8" fill="#FFFDF6" stroke="#B8860B" stroke-width="1.2"/><text x="1164.0" y="1160.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#8A6708" text-anchor="start">CI responsibilities (and non-responsibilities)</text><text x="1164.0" y="1186.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4A5568" text-anchor="start">• CI compiles, validates, tests, and produces the image.</text><text x="1164.0" y="1205.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4A5568" text-anchor="start">• CI does not mutate production Kubernetes.</text><text x="1164.0" y="1224.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4A5568" text-anchor="start">• On green: publish immutable image, then update the</text><text x="1164.0" y="1243.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4A5568" text-anchor="start">  deployment manifest in platform-gitops (step 8).</text><text x="1164.0" y="1262.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4A5568" text-anchor="start">• Merge of the app PR and the gitops PR are policy-gated.</text><text x="1164.0" y="1281.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4A5568" text-anchor="start">• Test orchestration is itself a distributed control plane.</text><text x="1164.0" y="1300.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4A5568" text-anchor="start">• Integration tests run in parallel workers — not on the</text><text x="1164.0" y="1319.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4A5568" text-anchor="start">  developer laptop and not on a single CI “agent box”.</text><rect x="1164.0" y="1406.0" width="110.0" height="22.0" rx="6" ry="6" fill="#155751" stroke="#155751" stroke-width="1.2"/><text x="1219.0" y="1421.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">CONTROL</text><rect x="2056.0" y="128.0" width="428.0" height="1360.0" rx="14" ry="14" fill="#F1E8F7" stroke="#6B3D8E" stroke-width="2.2" filter="url(#shadow)"/><path d="M 2056.0 142.0 a 14 14 0 0 1 14 -14 h 400.0 a 14 14 0 0 1 14 14 v 22.0 h -428.0 z" fill="#5A2D7A"/><text x="2072.0" y="152.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="start">Artifact Registry</text><text x="2468.0" y="152.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#F3F6FF" text-anchor="end">storage</text><rect x="2072.0" y="178.0" width="396.0" height="150.0" rx="8" ry="8" fill="#FFFFFF" stroke="#5A6577" stroke-width="1.6"/><rect x="2072.0" y="178.0" width="5" height="150.0" rx="2.5" fill="#5A2D7A"/><text x="2086.0" y="195.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1B2430" text-anchor="start">Build Service</text><text x="2086.0" y="212.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5C6B7A" text-anchor="start">Immutable OCI images from a green CI SHA. No</text><text x="2086.0" y="226.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5C6B7A" text-anchor="start">latest in prod.</text><rect x="2386.0" y="186.0" width="72.0" height="18.0" rx="9" ry="9" fill="#1B365D" stroke="#1B365D" stroke-width="0"/><text x="2422.0" y="199.5" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">BUILD</text><circle cx="2072.0" cy="178.0" r="13" fill="#1B365D" stroke="#FFFFFF" stroke-width="2.4"/><text x="2072.0" y="182.6" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><rect x="2072.0" y="348.0" width="396.0" height="340.0" rx="8" ry="8" fill="#FFFFFF" stroke="#5A6577" stroke-width="1.6"/><rect x="2072.0" y="348.0" width="5" height="340.0" rx="2.5" fill="#5A2D7A"/><text x="2086.0" y="365.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1B2430" text-anchor="start">Central Container Registry</text><text x="2086.0" y="382.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5C6B7A" text-anchor="start">Harbor · ECR · GCR · Artifact Registry</text><rect x="2386.0" y="356.0" width="72.0" height="18.0" rx="9" ry="9" fill="#1B365D" stroke="#1B365D" stroke-width="0"/><text x="2422.0" y="369.5" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">STORE</text><circle cx="2072.0" cy="348.0" r="13" fill="#1B365D" stroke="#FFFFFF" stroke-width="2.4"/><text x="2072.0" y="352.6" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text><rect x="2090.0" y="430.0" width="360.0" height="90.0" rx="8" ry="8" fill="#F7EFFF" stroke="#6B3D8E" stroke-width="1.4"/><text x="2108.0" y="458.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#5A2D7A" text-anchor="start">newsfeed-service:v1827</text><text x="2108.0" y="480.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5C6B7A" text-anchor="start">sha256:9f3a…c21   immutable</text><text x="2108.0" y="502.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5C6B7A" text-anchor="start">os/arch linux/amd64   184 MB</text><text x="2090.0" y="538.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4A5568" text-anchor="start">Treat as a storage system, not a</text><text x="2090.0" y="556.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4A5568" text-anchor="start">CI plugin. Sits BETWEEN CI and</text><text x="2090.0" y="574.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4A5568" text-anchor="start">the deployment platform.</text><text x="2090.0" y="592.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4A5568" text-anchor="start">Argo CD never builds images.</text><rect x="2072.0" y="708.0" width="396.0" height="220.0" rx="8" ry="8" fill="#F7EFFF" stroke="#6B3D8E" stroke-width="1.3"/><text x="2088.0" y="736.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#5A2D7A" text-anchor="start">What is stored here</text><text x="2088.0" y="762.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4A5568" text-anchor="start">• OCI images (app + sidecars)</text><text x="2088.0" y="782.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4A5568" text-anchor="start">• SBOM + provenance attestations</text><text x="2088.0" y="802.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4A5568" text-anchor="start">• Helm/OCI chart packages</text><text x="2088.0" y="822.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4A5568" text-anchor="start">• Signed tags (cosign)</text><text x="2088.0" y="842.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4A5568" text-anchor="start">• Retention / promotion policy</text><rect x="2072.0" y="948.0" width="396.0" height="240.0" rx="8" ry="8" fill="#F7EFFF" stroke="#6B3D8E" stroke-width="1.3"/><text x="2088.0" y="976.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#5A2D7A" text-anchor="start">Promotion (immutable)</text><text x="2088.0" y="1002.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4A5568" text-anchor="start">build-sha-a1b2  →  v1827</text><text x="2088.0" y="1024.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4A5568" text-anchor="start">v1827 referenced from gitops</text><text x="2088.0" y="1046.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4A5568" text-anchor="start">Nodes PULL images (step 11)</text><text x="2088.0" y="1068.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4A5568" text-anchor="start">No rebuild between envs</text><rect x="2088.0" y="1152.0" width="110.0" height="22.0" rx="6" ry="6" fill="#155751" stroke="#155751" stroke-width="1.2"/><text x="2143.0" y="1167.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">CONTROL</text><rect x="2072.0" y="1210.0" width="396.0" height="250.0" rx="8" ry="8" fill="#F7EFFF" stroke="#6B3D8E" stroke-width="1.3"/><text x="2088.0" y="1238.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#5A2D7A" text-anchor="start">Why it sits here</text><text x="2088.0" y="1264.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4A5568" text-anchor="start">CI writes. The cluster reads.</text><text x="2088.0" y="1284.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4A5568" text-anchor="start">Registry is the contract:</text><text x="2088.0" y="1304.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4A5568" text-anchor="start">if the digest is not here,</text><text x="2088.0" y="1324.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4A5568" text-anchor="start">Argo CD cannot sync a pod</text><text x="2088.0" y="1344.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4A5568" text-anchor="start">that will start. Image pull</text><text x="2088.0" y="1364.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4A5568" text-anchor="start">is an explicit data-plane hop.</text><text x="2088.0" y="1384.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4A5568" text-anchor="start">Credentials: node IAM / SA.</text><rect x="2504.0" y="128.0" width="780.0" height="1360.0" rx="14" ry="14" fill="#DDF3F0" stroke="#1E6B66" stroke-width="2.2" filter="url(#shadow)"/><path d="M 2504.0 142.0 a 14 14 0 0 1 14 -14 h 752.0 a 14 14 0 0 1 14 14 v 22.0 h -780.0 z" fill="#155751"/><text x="2520.0" y="152.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="start">Platform Control Plane</text><text x="3268.0" y="152.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#F3F6FF" text-anchor="end">A · Continuous Delivery</text><rect x="2520.0" y="176.0" width="748.0" height="620.0" rx="10" ry="10" fill="#E7F7F5" stroke="#1E6B66" stroke-width="1.8"/><path d="M 2520.0 186.0 a 10 10 0 0 1 10 -10 h 728.0 a 10 10 0 0 1 10 10 v 18.0 h -748.0 z" fill="#1E6B66"/><text x="2532.0" y="195.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start">A. Continuous Delivery / GitOps</text><text x="3256.0" y="195.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#F8FBFF" text-anchor="end">not a CI step</text><rect x="2536.0" y="218.0" width="716.0" height="200.0" rx="8" ry="8" fill="#FFFFFF" stroke="#1E6B66" stroke-width="1.6"/><rect x="2536.0" y="218.0" width="5" height="200.0" rx="2.5" fill="#155751"/><text x="2550.0" y="235.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1B2430" text-anchor="start">Argo CD</text><text x="2550.0" y="252.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5C6B7A" text-anchor="start">Always-on reconciler. Watches platform-gitops; diffs desired vs actual; syncs on drift.</text><rect x="3161.2" y="226.0" width="80.8" height="18.0" rx="9" ry="9" fill="#1B365D" stroke="#1B365D" stroke-width="0"/><text x="3201.6" y="239.5" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">ALWAYS ON</text><circle cx="2536.0" cy="218.0" r="13" fill="#1B365D" stroke="#FFFFFF" stroke-width="2.4"/><text x="2536.0" y="222.6" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">9</text><rect x="2536.0" y="434.0" width="716.0" height="44.0" rx="8" ry="8" fill="#FFFFFF" stroke="#1E6B66" stroke-width="1.3"/><text x="2894.0" y="462.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#155751" text-anchor="middle">CD  =  deployment  +  reconciliation</text><rect x="2536.0" y="492.0" width="228.0" height="70.0" rx="8" ry="8" fill="#FFFFFF" stroke="#5A6577" stroke-width="1.6"/><rect x="2536.0" y="492.0" width="5" height="70.0" rx="2.5" fill="#155751"/><text x="2550.0" y="509.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1B2430" text-anchor="start">Watch Git</text><text x="2550.0" y="526.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5C6B7A" text-anchor="start">platform-gitops</text><rect x="2780.0" y="492.0" width="228.0" height="70.0" rx="8" ry="8" fill="#FFFFFF" stroke="#5A6577" stroke-width="1.6"/><rect x="2780.0" y="492.0" width="5" height="70.0" rx="2.5" fill="#155751"/><text x="2794.0" y="509.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1B2430" text-anchor="start">Compare state</text><text x="2794.0" y="526.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5C6B7A" text-anchor="start">desired vs actual</text><rect x="3024.0" y="492.0" width="228.0" height="70.0" rx="8" ry="8" fill="#FFFFFF" stroke="#5A6577" stroke-width="1.6"/><rect x="3024.0" y="492.0" width="5" height="70.0" rx="2.5" fill="#155751"/><text x="3038.0" y="509.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1B2430" text-anchor="start">Sync cluster</text><text x="3038.0" y="526.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5C6B7A" text-anchor="start">apply / prune / drift</text><rect x="2536.0" y="578.0" width="716.0" height="200.0" rx="8" ry="8" fill="#F3FBFA" stroke="#1E6B66" stroke-width="1.2"/><text x="2552.0" y="606.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#155751" text-anchor="start">Arrow of record</text><text x="2552.0" y="632.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4A5568" text-anchor="start">Git (manifests)  →  Argo CD  →  Kubernetes API</text><text x="2552.0" y="652.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4A5568" text-anchor="start">• Argo CD is NOT a CI job and is not “run” per PR.</text><text x="2552.0" y="672.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4A5568" text-anchor="start">• CI updates Git; Argo CD updates the cluster.</text><text x="2552.0" y="692.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4A5568" text-anchor="start">• If someone clicks in the cloud console, drift is</text><text x="2552.0" y="712.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4A5568" text-anchor="start">  detected and the cluster is reconciled back to Git.</text><text x="2552.0" y="732.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4A5568" text-anchor="start">• App deploy ≠ infra create. See plane B below.</text><rect x="2520.0" y="814.0" width="748.0" height="110.0" rx="8" ry="8" fill="#FFFFFF" stroke="#5A6577" stroke-width="1.6"/><rect x="2520.0" y="814.0" width="5" height="110.0" rx="2.5" fill="#155751"/><text x="2534.0" y="831.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1B2430" text-anchor="start">Policy / admission  ·  OPA  ·  Kyverno  ·  PSS</text><text x="2534.0" y="848.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5C6B7A" text-anchor="start">Provenance, registry allow-list, limits. Evaluated at CI and again at admit.</text><rect x="3186.0" y="822.0" width="72.0" height="18.0" rx="9" ry="9" fill="#1B365D" stroke="#1B365D" stroke-width="0"/><text x="3222.0" y="835.5" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">CONTROL</text><rect x="2520.0" y="942.0" width="748.0" height="518.0" rx="8" ry="8" fill="#F3FBFA" stroke="#1E6B66" stroke-width="1.2"/><text x="2536.0" y="972.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#155751" text-anchor="start">Continuously running (not triggered)</text><text x="2536.0" y="1000.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4A5568" text-anchor="start">These control-plane services stay up:</text><text x="2536.0" y="1019.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4A5568" text-anchor="start">  · Argo CD application controller + repo server</text><text x="2536.0" y="1038.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4A5568" text-anchor="start">  · Kubernetes API / scheduler / controllers</text><text x="2536.0" y="1057.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4A5568" text-anchor="start">  · OTel collector  ·  policy webhook</text><text x="2536.0" y="1076.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4A5568" text-anchor="start">  · Terraform is invoked (plan/apply), then exits.</text><text x="2536.0" y="1095.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4A5568" text-anchor="start">    Desired infra state still lives in Git + state.</text><text x="2536.0" y="1114.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4A5568" text-anchor="start"></text><text x="2536.0" y="1133.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4A5568" text-anchor="start">Reconcilers of desired state:</text><text x="2536.0" y="1152.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4A5568" text-anchor="start">  · Argo CD   →  Kubernetes workload state</text><text x="2536.0" y="1171.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4A5568" text-anchor="start">  · Terraform →  cloud infrastructure state</text><text x="2536.0" y="1190.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4A5568" text-anchor="start"></text><text x="2536.0" y="1209.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4A5568" text-anchor="start">Infra provisioning is plane B, below this column,</text><text x="2536.0" y="1228.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4A5568" text-anchor="start">drawn with dashed teal arrows into the cloud.</text><text x="2536.0" y="1247.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4A5568" text-anchor="start"></text><text x="2536.0" y="1266.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4A5568" text-anchor="start">Platform engineers own plane B; product</text><text x="2536.0" y="1285.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4A5568" text-anchor="start">engineers own the numbered path 1–8.</text><rect x="40.0" y="1564.0" width="3244.0" height="556.0" rx="14" ry="14" fill="#DDF3F0" stroke="#1E6B66" stroke-width="2.2" filter="url(#shadow)"/><path d="M 40.0 1578.0 a 14 14 0 0 1 14 -14 h 3216.0 a 14 14 0 0 1 14 14 v 22.0 h -3244.0 z" fill="#155751"/><text x="56.0" y="1588.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="start">Platform Control Plane  ·  B. Infrastructure Provisioning</text><text x="3268.0" y="1588.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#F3F6FF" text-anchor="end">Terraform creates the infrastructure.  Argo CD deploys workloads onto it.</text><rect x="56.0" y="1620.0" width="400.0" height="130.0" rx="8" ry="8" fill="#FFF6D6" stroke="#8A6914" stroke-width="1.6"/><circle cx="84.0" cy="1678.4" r="8.3" fill="#155751"/><path d="M 69.0 1705.4 a 14.9 12.6 0 0 1 29.9 0 z" fill="#155751"/><text x="108.0" y="1679.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1B2430" text-anchor="start">Platform Engineer</text><text x="108.0" y="1699.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5C6B7A" text-anchor="start">Platform Engineer</text><rect x="480.0" y="1620.0" width="400.0" height="130.0" rx="8" ry="8" fill="#FFFFFF" stroke="#5A6577" stroke-width="1.6"/><rect x="480.0" y="1620.0" width="5" height="130.0" rx="2.5" fill="#155751"/><text x="494.0" y="1637.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1B2430" text-anchor="start">Terraform  (IaC)</text><text x="494.0" y="1654.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5C6B7A" text-anchor="start">plan/apply vs infra-terraform. Cloud</text><text x="494.0" y="1668.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5C6B7A" text-anchor="start">resources follow Git.</text><rect x="798.0" y="1628.0" width="72.0" height="18.0" rx="9" ry="9" fill="#1B365D" stroke="#1B365D" stroke-width="0"/><text x="834.0" y="1641.5" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">INVOKE</text><rect x="904.0" y="1620.0" width="420.0" height="130.0" rx="8" ry="8" fill="#FFFFFF" stroke="#5A6577" stroke-width="1.6"/><rect x="904.0" y="1620.0" width="5" height="130.0" rx="2.5" fill="#155751"/><text x="918.0" y="1637.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1B2430" text-anchor="start">Remote state backend</text><text x="918.0" y="1654.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5C6B7A" text-anchor="start">S3 + DynamoDB lock, or GCS. Lock prevents</text><text x="918.0" y="1668.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5C6B7A" text-anchor="start">concurrent apply.</text><rect x="1242.0" y="1628.0" width="72.0" height="18.0" rx="9" ry="9" fill="#1B365D" stroke="#1B365D" stroke-width="0"/><text x="1278.0" y="1641.5" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">STORE</text><rect x="1348.0" y="1620.0" width="400.0" height="130.0" rx="8" ry="8" fill="#FFFFFF" stroke="#5A6577" stroke-width="1.6"/><rect x="1348.0" y="1620.0" width="5" height="130.0" rx="2.5" fill="#155751"/><text x="1362.0" y="1637.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1B2430" text-anchor="start">Cloud Provider APIs</text><text x="1362.0" y="1654.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5C6B7A" text-anchor="start">AWS / GCP / Azure APIs. Terraform is the client.</text><rect x="1772.0" y="1620.0" width="1492.0" height="130.0" rx="8" ry="8" fill="#EEF0FA" stroke="#3F51B5" stroke-width="1.6"/><rect x="1772.0" y="1620.0" width="5" height="130.0" rx="2.5" fill="#303F9F"/><text x="1786.0" y="1637.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1B2430" text-anchor="start">Kubernetes + network + data services ready for Argo CD</text><text x="1786.0" y="1654.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5C6B7A" text-anchor="start">VPC, subnets, cluster, nodes, LBs, DBs, object storage, IAM, DNS, secrets, queues.</text><text x="64.0" y="1774.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#155751" text-anchor="start">Terraform provisions (data-plane substrate + managed services)</text><rect x="64.0" y="1790.0" width="88.0" height="30.0" rx="6" ry="6" fill="#FFFFFF" stroke="#1E6B66" stroke-width="1.2"/><text x="108.0" y="1809.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#155751" text-anchor="middle">VPC</text><rect x="160.0" y="1790.0" width="124.2" height="30.0" rx="6" ry="6" fill="#FFFFFF" stroke="#1E6B66" stroke-width="1.2"/><text x="222.1" y="1809.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#155751" text-anchor="middle">Public subnets</text><rect x="292.2" y="1790.0" width="131.5" height="30.0" rx="6" ry="6" fill="#FFFFFF" stroke="#1E6B66" stroke-width="1.2"/><text x="357.9" y="1809.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#155751" text-anchor="middle">Private subnets</text><rect x="431.7" y="1790.0" width="88.0" height="30.0" rx="6" ry="6" fill="#FFFFFF" stroke="#1E6B66" stroke-width="1.2"/><text x="475.7" y="1809.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#155751" text-anchor="middle">NAT / IGW</text><rect x="527.7" y="1790.0" width="160.7" height="30.0" rx="6" ry="6" fill="#FFFFFF" stroke="#1E6B66" stroke-width="1.2"/><text x="608.1" y="1809.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#155751" text-anchor="middle">Kubernetes clusters</text><rect x="696.4" y="1790.0" width="160.7" height="30.0" rx="6" ry="6" fill="#FFFFFF" stroke="#1E6B66" stroke-width="1.2"/><text x="776.8" y="1809.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#155751" text-anchor="middle">Compute node groups</text><rect x="865.1" y="1790.0" width="124.2" height="30.0" rx="6" ry="6" fill="#FFFFFF" stroke="#1E6B66" stroke-width="1.2"/><text x="927.2" y="1809.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#155751" text-anchor="middle">Load balancers</text><rect x="997.3" y="1790.0" width="182.6" height="30.0" rx="6" ry="6" fill="#FFFFFF" stroke="#1E6B66" stroke-width="1.2"/><text x="1088.6" y="1809.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#155751" text-anchor="middle">PostgreSQL / Cloud SQL</text><rect x="1187.9" y="1790.0" width="88.0" height="30.0" rx="6" ry="6" fill="#FFFFFF" stroke="#1E6B66" stroke-width="1.2"/><text x="1231.9" y="1809.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#155751" text-anchor="middle">Redis</text><rect x="1283.9" y="1790.0" width="131.5" height="30.0" rx="6" ry="6" fill="#FFFFFF" stroke="#1E6B66" stroke-width="1.2"/><text x="1349.7" y="1809.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#155751" text-anchor="middle">Kafka / Pub/Sub</text><rect x="1423.4" y="1790.0" width="124.2" height="30.0" rx="6" ry="6" fill="#FFFFFF" stroke="#1E6B66" stroke-width="1.2"/><text x="1485.5" y="1809.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#155751" text-anchor="middle">Object storage</text><rect x="1555.6" y="1790.0" width="182.6" height="30.0" rx="6" ry="6" fill="#FFFFFF" stroke="#1E6B66" stroke-width="1.2"/><text x="1646.9" y="1809.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#155751" text-anchor="middle">IAM / service accounts</text><rect x="1746.2" y="1790.0" width="88.0" height="30.0" rx="6" ry="6" fill="#FFFFFF" stroke="#1E6B66" stroke-width="1.2"/><text x="1790.2" y="1809.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#155751" text-anchor="middle">DNS</text><rect x="1842.2" y="1790.0" width="197.2" height="30.0" rx="6" ry="6" fill="#FFFFFF" stroke="#1E6B66" stroke-width="1.2"/><text x="1940.8" y="1809.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#155751" text-anchor="middle">Secrets infra (KMS / SM)</text><rect x="2047.4" y="1790.0" width="168.0" height="30.0" rx="6" ry="6" fill="#FFFFFF" stroke="#1E6B66" stroke-width="1.2"/><text x="2131.4" y="1809.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#155751" text-anchor="middle">Observability agents</text><rect x="56.0" y="1838.0" width="3208.0" height="256.0" rx="8" ry="8" fill="#F3FBFA" stroke="#1E6B66" stroke-width="1.2"/><text x="76.0" y="1868.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#155751" text-anchor="start">Second flow — infrastructure (dashed teal). Distinct from the numbered app-delivery path.</text><text x="76.0" y="1896.0" font-family="Inter, Liberation Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5568" text-anchor="start">Platform Engineer  →  Terraform  →  remote state  →  Cloud Provider APIs  →  network / Kubernetes / LB / DB / storage  →  cluster ready for Argo CD.</text>