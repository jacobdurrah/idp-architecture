name: Catalog regen + drift

# Regenerates catalog.json from the DATA shards + Map content whenever any of
# them changes (IG-08). On a push it commits the fresh catalog back; on a pull
# request it runs a drift check that fails if catalog.json is stale, so a shard
# edit that skipped regeneration is caught before merge.
on:
  push:
    paths:
      - '*-data-*.js'
      - 'content-*.js'
      - 'app.js'
      - 'tools/build-catalog.js'
      - '.github/workflows/catalog.yml'
  pull_request:
    paths:
      - '*-data-*.js'
      - 'content-*.js'
      - 'app.js'
      - 'tools/build-catalog.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate catalog.json
        run: npm run build:catalog

      - name: Drift check (pull requests)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          if git diff --quiet -- catalog.json; then
            echo "catalog.json is in sync with the shards."
          else
            echo "::error::catalog.json is out of date. Run 'npm run build:catalog' and commit the result."
            git --no-pager diff -- catalog.json
            exit 1
          fi

      - name: Commit regenerated catalog.json (pushes)
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          if git diff --cached --quiet; then
            echo "catalog.json already current"
          else
            git commit -m "Regenerate catalog.json"
            git push
          fi
