name: Assemble diagram.svg
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and commit diagram.svg
        run: |
          set -euo pipefail
          cat svg-head.svg svg-frag0.svg svg-frag1.svg svg-frag2.svg svg-frag3.svg svg-tail.svg > diagram.svg
          wc -c diagram.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagram.svg
          if git diff --cached --quiet; then
            echo "diagram.svg already current"
          else
            git commit -m "Add architecture diagram SVG"
            git push
          fi
