<text x="700.0" y="48.0" font-size="26" font-weight="750" fill="#2C2C2A" text-anchor="middle">Internal developer platform — the golden path</text>
<text x="700.0" y="72.0" font-size="13" font-weight="500" fill="#5F5E5A" text-anchor="middle">One code change: commit → build → test → deploy → run → observe · with the infrastructure plane that makes it possible</text>
<text x="700.0" y="92.0" font-size="12" font-weight="500" fill="#534AB7" text-anchor="middle">Dotted purple is telemetry coming home. A page, a canary, a revert. Not a dashboard graveyard.</text>
